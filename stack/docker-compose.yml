name: homelab-stack

x-common:
  tz: &tz
    TZ: ${TZ:-America/Mexico_City}

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: homelab-adguard
    restart: unless-stopped
    environment:
      <<: *tz
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${LAN_IP}:53:53/tcp"
      - "${LAN_IP}:53:53/udp"
      - "3000:80/tcp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    networks:
      - proxy

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: homelab-npm
    restart: unless-stopped
    environment:
      <<: *tz
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: homelab-portainer
    restart: unless-stopped
    environment:
      <<: *tz
      TRUSTED_ORIGINS: https://portainer.${LOCAL_DOMAIN:-homelab},http://portainer.${LOCAL_DOMAIN:-homelab}
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    networks:
      - proxy

  database:
    image: mariadb:11.4
    container_name: homelab-pterodactyl-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      <<: *tz
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${PANEL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PANEL_DB_ROOT_PASSWORD}
    volumes:
      - ./pterodactyl/database:/var/lib/mysql
    networks:
      - pterodactyl

  cache:
    image: redis:7-alpine
    container_name: homelab-pterodactyl-redis
    restart: unless-stopped
    environment:
      <<: *tz
    networks:
      - pterodactyl

  panel:
    image: ghcr.io/pterodactyl/panel:v1.15.2
    container_name: homelab-pterodactyl-panel
    restart: unless-stopped
    depends_on:
      - database
      - cache
    ports:
      - "8020:80"
    extra_hosts:
      - "${LAN_IP}:host-gateway"
    volumes:
      - ./pterodactyl/var:/app/var
      - ./pterodactyl/nginx:/etc/nginx/http.d
      - ./pterodactyl/certs:/etc/letsencrypt
      - ./pterodactyl/logs:/app/storage/logs
    environment:
      <<: *tz
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${TZ:-America/Mexico_City}
      APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR:-noreply@example.com}
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      TRUSTED_PROXIES: "*"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      DB_HOST: database
      DB_PORT: "3306"
      DB_PASSWORD: ${PANEL_DB_PASSWORD}
      MAIL_FROM: ${APP_SERVICE_AUTHOR:-noreply@example.com}
      MAIL_DRIVER: log
      MAIL_HOST: ""
      MAIL_PORT: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
    networks:
      - proxy
      - pterodactyl

  wings:
    profiles:
      - wings
    image: ghcr.io/pterodactyl/wings:v1.13.4
    container_name: homelab-pterodactyl-wings
    restart: unless-stopped
    tty: true
    environment:
      <<: *tz
    ports:
      - "8080:8080"
      - "2022:2022"
    extra_hosts:
      - "${LAN_IP}:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./wings/etc:/etc/pterodactyl
      - /var/lib/pterodactyl:/var/lib/pterodactyl
      - /var/log/pterodactyl:/var/log/pterodactyl
      - /tmp/pterodactyl:/tmp/pterodactyl
      - /run/wings:/run/wings
    networks:
      - proxy
      - pterodactyl

networks:
  proxy:
    driver: bridge
  pterodactyl:
    driver: bridge
